[project]
name = "videoprinterturbo-lipsync"
version = "0.1.0"
description = "VideoPrinterTurbo 本地 LipSync 后端服务"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "requests>=2.32,<3",
]
test-runtime = [
    "torch>=2,<3",
    "numpy>=1.24,<3",
    "Pillow>=9.1,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
